<!doctype html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yu-Gi-Oh Kolekcija</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="app-box p-4 p-md-5">
      <div class="d-flex justify-content-end mb-2">
        <a href="logout.php" class="btn btn-outline-danger btn-sm">Odjavi se</a>
      </div>

      <div class="text-center mb-4">
        <h1 class="main-title">Yu-Gi-Oh Baza Kartica</h1>
        <p class="text-muted mb-0">Unos, organizacija i filtriranje tvoje kolekcije</p>
      </div>

      <div class="d-flex flex-column flex-md-row gap-3 justify-content-center mb-4">
        <button id="btnDodajKarticu" class="btn btn-primary btn-lg px-4" type="button">Dodaj karticu</button>
        <button id="btnPrikaziKartice" class="btn btn-outline-dark btn-lg px-4" type="button">Moja kolekcija</button>
      </div>

      <section id="formaSekcija">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h3 class="mb-4">Unos nove kartice</h3>
            <form id="cardForm" class="row g-3" enctype="multipart/form-data">
              <div class="col-12 col-md-6">
                <label for="naziv" class="form-label">Naziv kartice</label>
                <input type="text" id="naziv" name="naziv" class="form-control" placeholder="Npr. Dark Magician" />
              </div>
              <div class="col-12 col-md-3">
                <label for="nivo" class="form-label">Nivo / Zvezdice</label>
                <input type="number" id="nivo" name="nivo" class="form-control" value="4" min="0" max="12" />
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label d-block">Tip kartice</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tip" id="tipCudoviste" value="Čudovište" checked />
                  <label class="form-check-label" for="tipCudoviste">Čudovište</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tip" id="tipMagija" value="Magija" />
                  <label class="form-check-label" for="tipMagija">Magija</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tip" id="tipZamka" value="Zamka" />
                  <label class="form-check-label" for="tipZamka">Zamka</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="napad" class="form-label">Napad (ATK)</label>
                <input type="number" id="napad" name="napad" class="form-control" value="0" />
              </div>
              <div class="col-12 col-md-6">
                <label for="odbrana" class="form-label">Odbrana (DEF)</label>
                <input type="number" id="odbrana" name="odbrana" class="form-control" value="0" />
              </div>
              <div class="col-12 col-md-6">
                <label for="slika" class="form-label">Slika kartice</label>
                <input type="file" id="slika" name="slika" class="form-control" accept="image/*" />
              </div>
              <div class="col-12">
                <label for="opis" class="form-label">Opis / Efekat</label>
                <textarea id="opis" name="opis" class="form-control" rows="3" placeholder="Tekst sa kartice..."></textarea>
              </div>
              <div class="col-12 d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-success px-4">Sačuvaj karticu</button>
                <button type="reset" class="btn btn-secondary px-4">Resetuj polja</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section id="karticeSekcija" class="d-none mt-4">
        <div class="card border-0 shadow-sm rounded-4 mb-4">
          <div class="card-body p-4">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-4">
                <label for="filterKategorija" class="form-label">Filtriraj po moći</label>
                <select id="filterKategorija" class="form-select">
                  <option value="Sve">Sve kartice</option>
                  <option value="Slaba">Slaba (< 2000)</option>
                  <option value="Srednja">Srednja (< 4000)</option>
                  <option value="Jaka">Jaka (< 6000)</option>
                  <option value="Legendarna">Legendarna (6000+)</option>
                </select>
              </div>
              <div class="col-12 col-md-4">
                <label for="sortiranje" class="form-label">Sortiranje po ukupnoj moći</label>
                <select id="sortiranje" class="form-select">
                  <option value="default">Bez sortiranja</option>
                  <option value="max-min">Od najjače ka najslabijoj</option>
                  <option value="min-max">Od najslabije ka najjačoj</option>
                </select>
              </div>
              <div class="col-12 col-md-4">
                <button id="btnPrimeni" class="btn btn-primary w-100" type="button">Primeni</button>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <h3 class="mb-0">Moja kolekcija</h3>
          <span id="brojKartica" class="badge text-bg-primary fs-6">0 kartica</span>
        </div>
        <div id="karticeContainer" class="row g-4"></div>
      </section>
    </div>
  </div>

  <div class="modal fade" id="modalUredi" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Uredi karticu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" class="row g-3" enctype="multipart/form-data">
            <input type="hidden" id="editId" name="id" />
            <div class="col-12 col-md-6">
              <label class="form-label">Naziv kartice</label>
              <input type="text" id="editNaziv" name="naziv" class="form-control" />
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label">Nivo</label>
              <input type="number" id="editNivo" name="nivo" class="form-control" />
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label d-block">Tip kartice</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="tip" id="editCudoviste" value="Čudovište" />
                <label class="form-check-label" for="editCudoviste">Čudovište</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="tip" id="editMagija" value="Magija" />
                <label class="form-check-label" for="editMagija">Magija</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="tip" id="editZamka" value="Zamka" />
                <label class="form-check-label" for="editZamka">Zamka</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Napad (ATK)</label>
              <input type="number" id="editNapad" name="napad" class="form-control" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Odbrana (DEF)</label>
              <input type="number" id="editOdbrana" name="odbrana" class="form-control" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Nova slika (opcionalno)</label>
              <input type="file" id="editSlika" name="slika" class="form-control" accept="image/*" />
            </div>
            <div class="col-12">
              <label class="form-label">Opis / Efekat</label>
              <textarea id="editOpis" name="opis" class="form-control" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Otkaži</button>
          <button type="button" class="btn btn-success" id="btnSacuvajIzmene">Sačuvaj izmene</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
